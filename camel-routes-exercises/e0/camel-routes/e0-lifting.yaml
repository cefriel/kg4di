- beans:
    - name: lifting
      type: com.cefriel.util.ChimeraResourceBean
      properties:
        url: "file://./lifting.vm"
        serializationFormat: "vtl"

- route:
    from:
      uri: "file://inbox"
      parameters:
        fileName: stops.txt
        noop: true
      steps:
        - convertBodyTo:
            type: "java.lang.String"
        - log:
            message: "\n E0 lifting input: ${body}\n"
        - to:
            uri: "mapt://csv"
            parameters:
              template: '#bean:lifting'
              format: "turtle"
              basePath: "outbox"
              filename: "e1-output.ttl"
        - log:
            message: "\n E0 lifting result: ${body}\n"

