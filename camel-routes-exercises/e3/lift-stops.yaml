- beans:
    # define ChimeraResourceBean for lifting MTL mapping
    - [ ... ]

- route:
    from:
      uri: "file:inbox"
      parameters:
        antInclude: "*.zip"
        noop: true
      steps:
        - unmarshal:
            zipFile:
              usingIterator: true
        - split:
            simple: "${body}"
            steps:
              - choice:
                  when:
                    - simple: "${header.CamelFileName} == 'stops.txt'"
                      steps:
                        - convertBodyTo:
                            type: "java.lang.String"
                        # perform lifting
                        - [ ... ]
                        # load rdf into Chimera RDF memory graph
                        - [ ... ]
                        - log:
                            message: "\n E1 lifting result: ${body}\n"
                        - multicast:
                            steps:
                              - to:
                                  uri: "direct:construct"
                              - to:
                                  uri: "direct:aggregate"

