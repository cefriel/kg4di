<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Visualization</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #map { width: 100%; flex: 1; min-height: 0; }
        .leaflet-attribution-flag { display: none !important; }
        #status {
            position: fixed;
            bottom: 52px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 60, 130, 0.82);
            color: #fff;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 13px;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.4s;
            display: flex;
            gap: 14px;
            align-items: center;
        }
        /* #status.hidden { opacity: 0; } — counter is always visible */
        .stat-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-stop { background: #5ba8f5; }
        .dot-landmark { background: #e03a3a; }

    </style>
</head>
<body>
    <div id="map"></div>
    <div id="status">
        <span class="stat-item"><span class="dot dot-stop"></span><span id="stop-count">0</span> stop<span id="stop-plural">s</span></span>
        <span class="stat-item"><span class="dot dot-landmark"></span><span id="landmark-count">0</span> landmark<span id="landmark-plural">s</span></span>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        const map = L.map('map').setView([40.7128, -74.0060], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Cluster group – handles 10 000+ pins without DOM overload
        const clusterGroup = L.markerClusterGroup({
            chunkedLoading: true,       // yields to browser between chunk insertions
            chunkSize: 500,             // markers per chunk
            chunkDelay: 10,            // ms between chunks
            maxClusterRadius: 60,
            disableClusteringAtZoom: 16
        });
        map.addLayer(clusterGroup);

        // Red icon for landmark type
        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });



        const API_TOKEN = 'tutorial-kg4di';
        let displayedCount = 0;
        let stopCount = 0;
        let landmarkCount = 0;
        const statusEl = document.getElementById('status');
        const stopCountEl = document.getElementById('stop-count');
        const stopPluralEl = document.getElementById('stop-plural');
        const landmarkCountEl = document.getElementById('landmark-count');
        const landmarkPluralEl = document.getElementById('landmark-plural');
        let statusTimer = null;

        function showStatus() {
            stopCountEl.textContent = stopCount.toLocaleString();
            stopPluralEl.textContent = stopCount !== 1 ? 's' : '';
            landmarkCountEl.textContent = landmarkCount.toLocaleString();
            landmarkPluralEl.textContent = landmarkCount !== 1 ? 's' : '';
        }

        async function checkForNewLocations() {
            try {
                const response = await fetch(`/api/locations?since=${displayedCount}`, {
                    headers: { 'Authorization': `Bearer ${API_TOKEN}` }
                });
                const data = await response.json();
                const newLocations = data.locations;

                if (!newLocations.length) return;

                // Build all markers first, then add in one batch
                const batch = [];
                let lastLat, lastLon;

                for (const { lat, lon, label, type, image } of newLocations) {
                    const isLandmark = type === 'landmark';
                    const markerOptions = isLandmark ? { icon: redIcon } : {};

                    if (isLandmark) landmarkCount++;
                    else stopCount++;

                    let popupContent = `<b>${label}</b><br>Lat: ${lat}<br>Lon: ${lon}`;
                    if (isLandmark && image) {
                        popupContent += `<br><a href="${image}" target="_blank" rel="noopener noreferrer" style="margin-top:6px;display:inline-block;">View Image</a>`;
                    }

                    batch.push(L.marker([lat, lon], markerOptions).bindPopup(popupContent));
                    lastLat = lat;
                    lastLon = lon;
                }

                // Single DOM operation for the whole batch
                clusterGroup.addLayers(batch);

                displayedCount = data.total;
                showStatus();

                // Pan once to the last received location
                if (lastLat !== undefined) {
                    map.setView([lastLat, lastLon], map.getZoom() < 5 ? 13 : map.getZoom());
                }
            } catch (error) {
                console.error('Error fetching locations:', error);
            }
        }

        // Poll every 500ms
        setInterval(checkForNewLocations, 500);
        checkForNewLocations();
    </script>
</body>
</html>
